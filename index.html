<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Elite | Ultimate Edition</title>
    
    <style>
        :root { 
            --accent: #0078d4; 
            --bg: #050505;
            --card: rgba(22, 22, 22, 0.98);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #888;
            --danger: #ff4d4d;
            --success: #25D366;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 110px; overflow-x: hidden;
            transition: opacity 0.6s ease;
        }

        .container { width: 92%; max-width: 440px; margin-top: 20px; }

        /* --- Animações --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 120, 212, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 120, 212, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 120, 212, 0); } }

        .glass-card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 24px; padding: 20px; margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease-out backwards;
        }

        h1 { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin: 0 0 15px 0; border-left: 3px solid var(--accent); padding-left: 12px; }

        /* --- Seletores Estilo Slider --- */
        .selector-wrap {
            display: flex; position: relative; background: rgba(0,0,0,0.4); 
            border-radius: 15px; padding: 4px; height: 50px; border: 1px solid var(--border);
            margin-bottom: 5px;
        }
        .slider-thumb { 
            position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); 
            background: var(--accent); border-radius: 12px; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1; 
        }
        .opt-btn { 
            flex: 1; z-index: 2; background: none; border: none; color: #fff; 
            font-size: 10px; font-weight: bold; cursor: pointer; text-align: center;
        }

        /* --- Tab Bar (Navegação Restaurada) --- */
        .tab-bar {
            position: fixed; bottom: 18px; width: 92%; max-width: 410px;
            background: rgba(18, 18, 18, 0.95); border: 1px solid var(--border);
            border-radius: 22px; display: flex; justify-content: space-around; 
            padding: 5px; z-index: 1000; backdrop-filter: blur(25px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .tab-btn { 
            color: var(--text-dim); cursor: pointer; text-align: center; flex: 1; 
            transition: all 0.3s ease; display: flex; flex-direction: column; 
            align-items: center; gap: 4px; padding: 10px 0; border-radius: 16px;
            border-top: 2px solid transparent;
        }
        .tab-btn i { font-style: normal; font-size: 18px; transition: 0.3s; }
        .tab-btn span { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .tab-btn.active { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.05); 
            border-top: 2px solid var(--accent);
            border-radius: 4px 4px 16px 16px;
        }
        .tab-btn.active i { transform: translateY(-2px); }
        .tab-btn.active span { color: var(--accent); }

        /* --- FAB e Drawer --- */
        .fab-logs {
            position: fixed; bottom: 105px; right: 20px; width: 54px; height: 54px;
            background: var(--accent); border-radius: 18px; display: none;
            align-items: center; justify-content: center; font-size: 22px;
            box-shadow: 0 8px 25px rgba(0, 120, 212, 0.4); z-index: 1500; cursor: pointer;
        }
        .drawer {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100%;
            background: var(--card); z-index: 2000; border-left: 1px solid var(--border);
            padding: 25px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(20px);
        }
        .drawer.open { right: 0; }

        /* --- Inputs e Modais --- */
        input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: #fff; transition: 0.3s; }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.06); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:active { transform: scale(0.96); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-box { width: 88%; max-width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 25px; text-align: center; }

        .hidden { display: none !important; }
        #toast { position: fixed; top: 30px; background: var(--accent); padding: 14px 28px; border-radius: 50px; font-weight: bold; transform: translateY(-150px); transition: 0.5s; z-index: 5000; }
        .list-item { background: rgba(255,255,255,0.02); padding: 14px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); animation: fadeIn 0.4s ease; }
    </style>
</head>
<body>

    <div id="toast">Notificação</div>
    <div id="fab-logs" class="fab-logs" onclick="toggleDrawer()">📜</div>

    <div id="drawer-logs" class="drawer">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Logs Sistema</h1>
            <span onclick="toggleDrawer()" style="cursor:pointer; font-size:20px;">✕</span>
        </div>
        <div id="log-content" style="font-size:11px; overflow-y:auto; height:90%;"></div>
    </div>

    <div id="modal-global" class="modal-overlay">
        <div class="modal-box">
            <h2 id="m-title" style="margin-top:0; font-size: 18px;"></h2>
            <p id="m-msg" style="color: var(--text-dim); font-size: 13px; margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="background: #333; color: #fff;" id="m-cancel" onclick="closeModal()"></button>
                <button class="btn" style="background: var(--danger); color: #fff;" id="m-confirm"></button>
            </div>
        </div>
    </div>

    <div id="page-login" class="container" style="margin-top: 15vh;">
        <div class="glass-card" style="text-align: center;">
            <h1 id="txt-welcome-title" style="border:none; text-align:center;">Infinity Elite Access</h1>
            <input type="text" id="login-user" placeholder="Usuário">
            <input type="password" id="login-pass" placeholder="Senha">
            <button class="btn btn-primary" id="btn-entrar">Login</button>
        </div>
    </div>

    <div id="page-dash" class="container hidden">
        
        <section id="view-home" class="tab-content">
            <div class="glass-card" style="border-left: 4px solid #f1c40f;">
                <h1 id="txt-ann-title">Avisos</h1>
                <p id="ui-ann" style="font-size: 12px; margin: 0;">...</p>
                <button id="ui-sup-btn" class="btn hidden" style="background:var(--success); color:#fff; margin-top:10px;" onclick="handleSupport()">WhatsApp Support</button>
            </div>

            <div class="glass-card">
                <h1 id="txt-gen-title">Gerar</h1>
                <div class="selector-wrap">
                    <div id="ui-slider" class="slider-thumb" style="width: calc((100% - 8px) / 5);"></div>
                    <button class="opt-btn" onclick="updatePlan(1, 0)">24H</button>
                    <button class="opt-btn" onclick="updatePlan(3, 1)">3D</button>
                    <button class="opt-btn" onclick="updatePlan(7, 2)">7D</button>
                    <button class="opt-btn" onclick="updatePlan(15, 3)">15D</button>
                    <button class="opt-btn" onclick="updatePlan(30, 4)">30D</button>
                </div>
                <input type="hidden" id="val-days" value="1">
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <input type="number" id="val-qty" value="1" style="width: 80px; margin:0;">
                    <button class="btn btn-primary" id="btn-generate" style="animation: pulse 2s infinite;">GERAR</button>
                </div>
                <div id="ui-key-result" style="display:none; margin-top:15px; padding:15px; border:2px dashed var(--accent); border-radius: 12px; text-align:center; cursor:pointer;" onclick="copyToClipboard()"></div>
            </div>

            <div class="glass-card" style="display:flex; justify-content: space-around; text-align:center;">
                <div><small id="txt-credits" style="font-size:9px; color:var(--text-dim);">CREDITS</small><div id="ui-creds" style="font-size:22px; font-weight:900; color:var(--accent);">0</div></div>
                <div><small id="txt-total" style="font-size:9px; color:var(--text-dim);">TOTAL KEYS</small><div id="ui-total-keys" style="font-size:22px; font-weight:900;">0</div></div>
            </div>
        </section>

        <section id="view-keys" class="tab-content hidden">
            <div class="glass-card">
                <h1 id="txt-key-list-title">Minhas Keys</h1>
                <input type="text" id="key-search" placeholder="Buscar key...">
                <div id="list-keys" style="max-height:450px; overflow-y:auto;"></div>
            </div>
        </section>

        <section id="view-resellers" class="tab-content hidden">
            <div class="glass-card">
                <h1 id="txt-res-title">Gestão de Revenda</h1>
                <input type="text" id="res-name" placeholder="Usuário">
                <input type="text" id="res-pass" placeholder="Senha">
                <input type="number" id="res-creds" placeholder="Créditos">
                <button class="btn btn-primary" id="btn-save-res">Salvar Revendedor</button>
            </div>
            <div id="list-resellers"></div>
        </section>

        <section id="view-settings" class="tab-content hidden">
            <div class="glass-card">
                <h1 id="txt-lang-title">Idioma / Language</h1>
                <div class="selector-wrap">
                    <div id="lang-slider" class="slider-thumb" style="width: calc((100% - 8px) / 2);"></div>
                    <button class="opt-btn" onclick="setLang('pt', 0)">Português</button>
                    <button class="opt-btn" onclick="setLang('en', 1)">English</button>
                </div>
            </div>

            <div id="admin-panel" class="hidden">
                <div class="glass-card">
                    <h1 id="txt-settings-title">Painel Administrativo</h1>
                    <input type="text" id="sys-ann" placeholder="Comunicado">
                    <input type="text" id="sys-sup" placeholder="Link WhatsApp">
                    <button class="btn btn-primary" id="btn-save-sys" style="background:#222; margin-bottom:12px;">Salvar Sistema</button>
                    <div style="display:flex; gap:10px;">
                        <input type="color" id="sys-color" style="height:48px; width:70px; padding:4px;">
                        <button class="btn btn-primary" id="btn-apply-color" style="flex:1">Mudar Cor</button>
                    </div>
                </div>
                <div class="glass-card">
                    <button class="btn" style="background:var(--danger); color:#fff;" id="btn-purge-keys">LIMPAR TUDO (KEYS)</button>
                </div>
            </div>
        </section>

        <nav class="tab-bar">
            <div class="tab-btn active" onclick="navigate('home', this)"><i>🏠</i><span id="label-home">Home</span></div>
            <div class="tab-btn" onclick="navigate('keys', this)"><i>🔑</i><span id="label-keys">Keys</span></div>
            <div class="tab-btn admin-only" onclick="navigate('resellers', this)"><i>👥</i><span id="label-res">Revendas</span></div>
            <div class="tab-btn" onclick="navigate('settings', this)"><i>⚙️</i><span id="label-set">Ajustes</span></div>
            <div class="tab-btn" onclick="confirmLogout()"><i>🚪</i><span id="label-logout">Sair</span></div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update, get, push } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTxuvp-qS6s8UaugTXWk_gebJdZugFWhw",
            authDomain: "painel-loginyashin.firebaseapp.com",
            databaseURL: "https://painel-loginyashin-default-rtdb.firebaseio.com",
            projectId: "painel-loginyashin"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userSession = { name: "", isAdmin: false, credits: 0 };
        let currentModalAction = null;
        let supportLink = "";

        const languages = {
            pt: {
                welcome: "Infinity Elite Access", home: "Início", keys: "Keys", res: "Revendas", set: "Ajustes", out: "Sair",
                ann: "Comunicados", gen: "Gerar Acessos", cre: "CRÉDITOS", tot: "TOTAL KEYS", btnGen: "GERAR AGORA",
                logoutT: "Sair", logoutM: "Deseja realmente sair?", conf: "Sim", canc: "Não",
                purgeT: "Limpar Banco", purgeM: "Confirmar exclusão de todas as keys?", langT: "Idioma",
                search: "Buscar...", del: "Apagar", reset: "Reset HWID"
            },
            en: {
                welcome: "Infinity Elite Access", home: "Home", keys: "Keys", res: "Resellers", set: "Settings", out: "Logout",
                ann: "Announcements", gen: "Generate Access", cre: "CREDITS", tot: "TOTAL KEYS", btnGen: "GENERATE NOW",
                logoutT: "Logout", logoutM: "Do you want to exit?", conf: "Yes", canc: "No",
                purgeT: "Purge", purgeM: "Delete all keys from database?", langT: "Language",
                search: "Search...", del: "Delete", reset: "Reset HWID"
            }
        };

        let currentLang = localStorage.getItem('panel_lang') || 'pt';

        window.setLang = (lang, index) => {
            currentLang = lang;
            localStorage.setItem('panel_lang', lang);
            document.getElementById('lang-slider').style.transform = `translateX(${index * 100}%)`;
            const t = languages[lang];
            document.getElementById('label-home').innerText = t.home;
            document.getElementById('label-keys').innerText = t.keys;
            if(document.getElementById('label-res')) document.getElementById('label-res').innerText = t.res;
            document.getElementById('label-set').innerText = t.set;
            document.getElementById('label-logout').innerText = t.out;
            document.getElementById('txt-ann-title').innerText = t.ann;
            document.getElementById('txt-gen-title').innerText = t.gen;
            document.getElementById('btn-generate').innerText = t.btnGen;
            document.getElementById('txt-credits').innerText = t.cre;
            document.getElementById('txt-total').innerText = t.tot;
            document.getElementById('txt-lang-title').innerText = t.langT;
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.transform = "translateY(0px)";
            setTimeout(() => t.style.transform = "translateY(-150px)", 3000);
        };

        window.openModal = (title, msg, action) => {
            const t = languages[currentLang];
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-msg').innerText = msg;
            document.getElementById('m-cancel').innerText = t.canc;
            document.getElementById('m-confirm').innerText = t.conf;
            document.getElementById('modal-global').style.display = 'flex';
            currentModalAction = action;
        };

        window.closeModal = () => document.getElementById('modal-global').style.display = 'none';
        document.getElementById('m-confirm').onclick = () => { if(currentModalAction) currentModalAction(); closeModal(); };
        window.toggleDrawer = () => document.getElementById('drawer-logs').classList.toggle('open');

        window.navigate = (id, el) => {
            if(id === 'resellers' && !userSession.isAdmin) return;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
        };

        window.updatePlan = (days, index) => {
            document.getElementById('ui-slider').style.transform = `translateX(${index * 100}%)`;
            document.getElementById('val-days').value = days;
        };

        document.getElementById('btn-entrar').onclick = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === "admin" && p === "sss") {
                userSession = { name: u, isAdmin: true, credits: "∞" };
                launch();
            } else {
                const snap = await get(ref(db, `resellers/${u}`));
                if(snap.exists() && snap.val().password === p) {
                    userSession = { name: u, isAdmin: false, credits: snap.val().credits };
                    launch();
                } else { showToast("Erro!"); }
            }
        };

        function launch() {
            document.getElementById('page-login').classList.add('hidden');
            document.getElementById('page-dash').classList.remove('hidden');
            if(userSession.isAdmin) {
                document.getElementById('fab-logs').style.display = 'flex';
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                document.querySelectorAll('.admin-only').forEach(e => e.remove());
            }
            setLang(currentLang, currentLang === 'pt' ? 0 : 1);
            init();
        }

        function init() {
            onValue(ref(db, 'settings'), snap => {
                const d = snap.val();
                document.getElementById('ui-ann').innerText = d?.announcement || "...";
                supportLink = d?.support || "";
                document.getElementById('ui-sup-btn').classList.toggle('hidden', !supportLink);
            });
            onValue(ref(db, 'keys'), snap => renderKeys(snap.val() || {}));
            if(userSession.isAdmin) {
                onValue(ref(db, 'logs'), s => renderLogs(s.val()));
                onValue(ref(db, 'resellers'), s => renderResellers(s.val()));
                onValue(ref(db, 'keys'), s => { document.getElementById('ui-total-keys').innerText = s.exists() ?
