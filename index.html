<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Elite | Ultimate Edition</title>
    
    <style>
        :root { 
            --accent: #0078d4; 
            --bg: #050505;
            --card: rgba(22, 22, 22, 0.98);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #888;
            --danger: #ff4d4d;
            --success: #25D366;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 110px; overflow-x: hidden;
            transition: opacity 0.6s ease;
        }

        .container { width: 92%; max-width: 440px; margin-top: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 120, 212, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 120, 212, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 120, 212, 0); } }

        .glass-card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 24px; padding: 20px; margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease-out backwards;
        }

        h1 { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin: 0 0 15px 0; border-left: 3px solid var(--accent); padding-left: 12px; }

        .selector-wrap {
            display: flex; position: relative; background: rgba(0,0,0,0.4); 
            border-radius: 15px; padding: 4px; height: 50px; border: 1px solid var(--border);
            margin-bottom: 5px;
        }
        .slider-thumb { 
            position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); 
            background: var(--accent); border-radius: 12px; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1; 
        }
        .opt-btn { 
            flex: 1; z-index: 2; background: none; border: none; color: #fff; 
            font-size: 10px; font-weight: bold; cursor: pointer; text-align: center;
        }

        .tab-bar {
            position: fixed; bottom: 18px; width: 92%; max-width: 410px;
            background: rgba(18, 18, 18, 0.95); border: 1px solid var(--border);
            border-radius: 22px; display: flex; justify-content: space-around; 
            padding: 5px; z-index: 1000; backdrop-filter: blur(25px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .tab-btn { 
            color: var(--text-dim); cursor: pointer; text-align: center; flex: 1; 
            transition: all 0.3s ease; display: flex; flex-direction: column; 
            align-items: center; gap: 4px; padding: 10px 0; border-radius: 16px;
            border-top: 2px solid transparent;
        }
        .tab-btn i { font-style: normal; font-size: 18px; transition: 0.3s; }
        .tab-btn span { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .tab-btn.active { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.05); 
            border-top: 2px solid var(--accent);
            border-radius: 4px 4px 16px 16px;
        }
        .tab-btn.active i { transform: translateY(-2px); }
        .tab-btn.active span { color: var(--accent); }

        .fab-logs {
            position: fixed; bottom: 105px; right: 20px; width: 54px; height: 54px;
            background: var(--accent); border-radius: 18px; display: none;
            align-items: center; justify-content: center; font-size: 22px;
            box-shadow: 0 8px 25px rgba(0, 120, 212, 0.4); z-index: 1500; cursor: pointer;
        }
        .drawer {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100%;
            background: var(--card); z-index: 2000; border-left: 1px solid var(--border);
            padding: 25px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(20px);
        }
        .drawer.open { right: 0; }

        input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: #fff; transition: 0.3s; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: #fff; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-box { width: 88%; max-width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 25px; text-align: center; }

        .hidden { display: none !important; }
        #toast { position: fixed; top: 30px; background: var(--accent); padding: 14px 28px; border-radius: 50px; font-weight: bold; transform: translateY(-150px); transition: 0.5s; z-index: 5000; }
        .list-item { background: rgba(255,255,255,0.02); padding: 14px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="toast">Notificação</div>
    <div id="fab-logs" class="fab-logs">📜</div>

    <div id="drawer-logs" class="drawer">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Logs Sistema</h1>
            <span id="close-drawer" style="cursor:pointer; font-size:20px;">✕</span>
        </div>
        <div id="log-content" style="font-size:11px; overflow-y:auto; height:90%;"></div>
    </div>

    <div id="modal-global" class="modal-overlay">
        <div class="modal-box">
            <h2 id="m-title" style="margin-top:0; font-size: 18px;"></h2>
            <p id="m-msg" style="color: var(--text-dim); font-size: 13px; margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="background: #333; color: #fff;" id="m-cancel">Cancelar</button>
                <button class="btn" style="background: var(--danger); color: #fff;" id="m-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="page-login" class="container" style="margin-top: 15vh;">
        <div class="glass-card" style="text-align: center;">
            <h1 id="txt-welcome-title" style="border:none; text-align:center;">Infinity Elite Access</h1>
            <input type="text" id="login-user" placeholder="Usuário">
            <input type="password" id="login-pass" placeholder="Senha">
            <button class="btn btn-primary" id="btn-entrar">Login</button>
        </div>
    </div>

    <div id="page-dash" class="container hidden">
        <section id="view-home" class="tab-content">
            <div class="glass-card" style="border-left: 4px solid #f1c40f;">
                <h1 id="txt-ann-title">Avisos</h1>
                <p id="ui-ann" style="font-size: 12px; margin: 0;">...</p>
                <button id="ui-sup-btn" class="btn hidden" style="background:var(--success); color:#fff; margin-top:10px;">WhatsApp Support</button>
            </div>
            <div class="glass-card">
                <h1 id="txt-gen-title">Gerar</h1>
                <div class="selector-wrap">
                    <div id="ui-slider" class="slider-thumb" style="width: calc((100% - 8px) / 5);"></div>
                    <button class="opt-btn" id="plan-0">24H</button>
                    <button class="opt-btn" id="plan-1">3D</button>
                    <button class="opt-btn" id="plan-2">7D</button>
                    <button class="opt-btn" id="plan-3">15D</button>
                    <button class="opt-btn" id="plan-4">30D</button>
                </div>
                <input type="hidden" id="val-days" value="1">
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <input type="number" id="val-qty" value="1" style="width: 80px; margin:0;">
                    <button class="btn btn-primary" id="btn-generate" style="animation: pulse 2s infinite;">GERAR</button>
                </div>
                <div id="ui-key-result" style="display:none; margin-top:15px; padding:15px; border:2px dashed var(--accent); border-radius: 12px; text-align:center; cursor:pointer;"></div>
            </div>
            <div class="glass-card" style="display:flex; justify-content: space-around; text-align:center;">
                <div><small id="txt-credits" style="font-size:9px; color:var(--text-dim);">CREDITS</small><div id="ui-creds" style="font-size:22px; font-weight:900; color:var(--accent);">0</div></div>
                <div><small id="txt-total" style="font-size:9px; color:var(--text-dim);">TOTAL KEYS</small><div id="ui-total-keys" style="font-size:22px; font-weight:900;">0</div></div>
            </div>
        </section>

        <section id="view-keys" class="tab-content hidden">
            <div class="glass-card">
                <h1 id="txt-key-list-title">Minhas Keys</h1>
                <input type="text" id="key-search" placeholder="Buscar key...">
                <div id="list-keys" style="max-height:450px; overflow-y:auto;"></div>
            </div>
        </section>

        <section id="view-resellers" class="tab-content hidden">
            <div class="glass-card">
                <h1 id="txt-res-title">Gestão de Revenda</h1>
                <input type="text" id="res-name" placeholder="Usuário">
                <input type="text" id="res-pass" placeholder="Senha">
                <input type="number" id="res-creds" placeholder="Créditos">
                <button class="btn btn-primary" id="btn-save-res">Salvar Revendedor</button>
            </div>
            <div id="list-resellers"></div>
        </section>

        <section id="view-settings" class="tab-content hidden">
            <div class="glass-card">
                <h1 id="txt-lang-title">Idioma / Language</h1>
                <div class="selector-wrap">
                    <div id="lang-slider" class="slider-thumb" style="width: calc((100% - 8px) / 2);"></div>
                    <button class="opt-btn" id="lang-pt">Português</button>
                    <button class="opt-btn" id="lang-en">English</button>
                </div>
            </div>
            <div id="admin-panel" class="hidden">
                <div class="glass-card">
                    <h1 id="txt-settings-title">Painel Administrativo</h1>
                    <input type="text" id="sys-ann" placeholder="Comunicado">
                    <input type="text" id="sys-sup" placeholder="Link WhatsApp">
                    <button class="btn btn-primary" id="btn-save-sys" style="background:#222; margin-bottom:12px;">Salvar Sistema</button>
                    <div style="display:flex; gap:10px;">
                        <input type="color" id="sys-color" style="height:48px; width:70px; padding:4px;">
                        <button class="btn btn-primary" id="btn-apply-color" style="flex:1">Mudar Cor</button>
                    </div>
                </div>
                <div class="glass-card">
                    <button class="btn" style="background:var(--danger); color:#fff;" id="btn-purge-keys">LIMPAR TUDO (KEYS)</button>
                </div>
            </div>
        </section>

        <nav class="tab-bar">
            <div class="tab-btn active" id="nav-home"><i>🏠</i><span id="label-home">Home</span></div>
            <div class="tab-btn" id="nav-keys"><i>🔑</i><span id="label-keys">Keys</span></div>
            <div class="tab-btn admin-only" id="nav-res"><i>👥</i><span id="label-res">Revendas</span></div>
            <div class="tab-btn" id="nav-set"><i>⚙️</i><span id="label-set">Ajustes</span></div>
            <div class="tab-btn" id="nav-out"><i>🚪</i><span id="label-logout">Sair</span></div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update, get, push } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTxuvp-qS6s8UaugTXWk_gebJdZugFWhw",
            authDomain: "painel-loginyashin.firebaseapp.com",
            databaseURL: "https://painel-loginyashin-default-rtdb.firebaseio.com",
            projectId: "painel-loginyashin"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userSession = { name: "", isAdmin: false, credits: 0 };
        let currentModalAction = null;
        let supportLink = "";
        let currentLang = localStorage.getItem('panel_lang') || 'pt';

        const languages = {
            pt: { welcome: "Infinity Elite Access", home: "Início", keys: "Keys", res: "Revendas", set: "Ajustes", out: "Sair", ann: "Comunicados", gen: "Gerar Acessos", cre: "CRÉDITOS", tot: "TOTAL KEYS", btnGen: "GERAR AGORA", logoutT: "Sair", logoutM: "Deseja sair?", conf: "Sim", canc: "Não", langT: "Idioma", search: "Buscar...", del: "Apagar", reset: "Reset HWID" },
            en: { welcome: "Infinity Elite Access", home: "Home", keys: "Keys", res: "Resellers", set: "Settings", out: "Logout", ann: "Announcements", gen: "Generate Access", cre: "CREDITS", tot: "TOTAL KEYS", btnGen: "GENERATE NOW", logoutT: "Logout", logoutM: "Do you want to exit?", conf: "Yes", canc: "No", langT: "Language", search: "Search...", del: "Delete", reset: "Reset HWID" }
        };

        window.addEventListener('DOMContentLoaded', () => {
            // LOGIN HANDLER
            document.getElementById('btn-entrar').addEventListener('click', async () => {
                const u = document.getElementById('login-user').value.trim();
                const p = document.getElementById('login-pass').value.trim();
                
                try {
                    if(u === "admin" && p === "sss") {
                        userSession = { name: u, isAdmin: true, credits: "∞" };
                        launch();
                    } else {
                        const snap = await get(ref(db, `resellers/${u}`));
                        if(snap.exists() && snap.val().password === p) {
                            userSession = { name: u, isAdmin: false, credits: snap.val().credits };
                            launch();
                        } else { alert("Login Incorreto!"); }
                    }
                } catch (e) {
                    alert("Erro Firebase: Domínio não autorizado ou Regras bloqueadas. Verifique o console do Firebase.");
                }
            });

            // NAVIGATION HANDLERS
            document.getElementById('nav-home').onclick = (e) => navigate('home', e.currentTarget);
            document.getElementById('nav-keys').onclick = (e) => navigate('keys', e.currentTarget);
            if(document.getElementById('nav-res')) document.getElementById('nav-res').onclick = (e) => navigate('resellers', e.currentTarget);
            document.getElementById('nav-set').onclick = (e) => navigate('settings', e.currentTarget);
            document.getElementById('nav-out').onclick = () => confirmLogout();

            // PLAN SELECTORS
            const plans = [1, 3, 7, 15, 30];
            plans.forEach((d, i) => {
                document.getElementById(`plan-${i}`).onclick = () => {
                    document.getElementById('ui-slider').style.transform = `translateX(${i * 100}%)`;
                    document.getElementById('val-days').value = d;
                };
            });

            // LANGUAGE SELECTORS
            document.getElementById('lang-pt').onclick = () => setLang('pt', 0);
            document.getElementById('lang-en').onclick = () => setLang('en', 1);

            // ADMIN ACTIONS
            document.getElementById('btn-save-sys').onclick = () => update(ref(db, 'settings'), { announcement: document.getElementById('sys-ann').value, support: document.getElementById('sys-sup').value });
            document.getElementById('btn-apply-color').onclick = () => document.documentElement.style.setProperty('--accent', document.getElementById('sys-color').value);
            document.getElementById('btn-purge-keys').onclick = () => openModal("Purge", "Confirmar?", () => remove(ref(db, 'keys')));
            document.getElementById('btn-save-res').onclick = () => {
                const u = document.getElementById('res-name').value.trim();
                const p = document.getElementById('res-pass').value.trim();
                const c = parseInt(document.getElementById('res-creds').value) || 0;
                if(u && p) set(ref(db, `resellers/${u}`), { password: p, credits: c });
            };

            // MODAL/DRAWER
            document.getElementById('m-confirm').onclick = () => { if(currentModalAction) currentModalAction(); closeModal(); };
            document.getElementById('m-cancel').onclick = () => closeModal();
            document.getElementById('fab-logs').onclick = () => toggleDrawer();
            document.getElementById('close-drawer').onclick = () => toggleDrawer();

            // GENERATE
            document.getElementById('btn-generate').onclick = async () => {
                const q = parseInt(document.getElementById('val-qty').value) || 1;
                const d = parseInt(document.getElementById('val-days').value);
                if(!userSession.isAdmin && userSession.credits < (q*d)) return alert("Sem créditos!");
                let key = "ELITE-" + Math.random().toString(36).substr(2, 9).toUpperCase();
                await set(ref(db, `keys/${key}`), { expiry: d + " Dias", creator: userSession.name, hwid: "" });
                if(!userSession.isAdmin) update(ref(db, `resellers/${userSession.name}`), { credits: userSession.credits - (q*d) });
                push(ref(db, 'logs'), { user: userSession.name, action: `Gerou ${key}`, date: new Date().toLocaleString() });
                const res = document.getElementById('ui-key-result');
                res.style.display = "block"; res.innerHTML = `<b>${key}</b>`;
                alert("Key Gerada!");
            };

            document.getElementById('ui-key-result').onclick = () => {
                navigator.clipboard.writeText(document.getElementById('ui-key-result').innerText);
                alert("Copiado!");
            };

            document.getElementById('key-search').oninput = () => { get(ref(db, 'keys')).then(s => renderKeys(s.val() || {})); };
        });

        function launch() {
            document.getElementById('page-login').classList.add('hidden');
            document.getElementById('page-dash').classList.remove('hidden');
            if(userSession.isAdmin) {
                document.getElementById('fab-logs').style.display = 'flex';
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                document.querySelectorAll('.admin-only').forEach(e => e.remove());
            }
            setLang(currentLang, currentLang === 'pt' ? 0 : 1);
            init();
        }

        function setLang(lang, index) {
            currentLang = lang;
            localStorage.setItem('panel_lang', lang);
            document.getElementById('lang-slider').style.transform = `translateX(${index * 100}%)`;
            const t = languages[lang];
            document.getElementById('label-home').innerText = t.home;
            document.getElementById('label-keys').innerText = t.keys;
            if(document.getElementById('label-res')) document.getElementById('label-res').innerText = t.res;
            document.getElementById('label-set').innerText = t.set;
            document.getElementById('label-logout').innerText = t.out;
            document.getElementById('txt-ann-title').innerText = t.ann;
            document.getElementById('txt-gen-title').innerText = t.gen;
            document.getElementById('btn-generate').innerText = t.btnGen;
            document.getElementById('txt-credits').innerText = t.cre;
            document.getElementById('txt-total').innerText = t.tot;
            document.getElementById('txt-lang-title').innerText = t.langT;
        }

        function init() {
            onValue(ref(db, 'settings'), snap => {
                const d = snap.val();
                document.getElementById('ui-ann').innerText = d?.announcement || "...";
                supportLink = d?.support || "";
                document.getElementById('ui-sup-btn').classList.toggle('hidden', !supportLink);
            });
            onValue(ref(db, 'keys'), snap => renderKeys(snap.val() || {}));
            if(userSession.isAdmin) {
                onValue(ref(db, 'logs'), s => renderLogs(s.val()));
                onValue(ref(db, 'resellers'), s => renderResellers(s.val()));
            } else {
                onValue(ref(db, `resellers/${userSession.name}/credits`), s => {
                    userSession.credits = s.val() || 0;
                    document.getElementById('ui-creds').innerText = userSession.credits;
                });
            }
        }

        function renderKeys(data) {
            const list = document.getElementById('list-keys');
            const search = document.getElementById('key-search').value.toUpperCase();
            list.innerHTML = "";
            Object.keys(data).reverse().forEach(id => {
                const k = data[id];
                if(!userSession.isAdmin && k.creator !== userSession.name) return;
                if(!id.includes(search)) return;
                const div = document.createElement('div');
                div.className = "list-item";
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="color:var(--accent)">${id}</b>
                        <button onclick="window.resetHwid('${id}')" style="background:var(--accent); border:none; color:#fff; padding:5px 10px; border-radius:8px; font-size:9px;">RESET</button>
                    </div>
                    <div style="font-size:11px; margin-top:8px; display:flex; justify-content:space-between;">
                        <span>${k.expiry} | Por: ${k.creator}</span>
                        <span style="color:var(--danger); cursor:pointer;" onclick="window.deleteKey('${id}')">APAGAR</span>
                    </div>`;
                list.appendChild(div);
            });
        }

        function renderResellers(data) {
            const list = document.getElementById('list-resellers');
            list.innerHTML = ""; if(!data) return;
            Object.keys(data).forEach(u => {
                const div = document.createElement('div');
                div.className = "list-item";
                div.innerHTML = `<b>${u}</b> <span style="float:right; color:var(--accent);">${data[u].credits} CR</span><br>
                <button class="btn" style="padding:5px; margin-top:10px; background:#333; color:#fff;" onclick="window.editReseller('${u}')">EDIT</button>
                <button class="btn" style="padding:5px; margin-top:10px; background:var(--danger); color:#fff;" onclick="window.deleteReseller('${u}')">REMOVE</button>`;
                list.appendChild(div);
            });
        }

        function renderLogs(data) {
            const cont = document.getElementById('log-content');
            cont.innerHTML = ""; if(!data) return;
            Object.values(data).reverse().slice(0,30).forEach(l => {
                cont.innerHTML += `<div style="border-bottom:1px solid #222; padding:5px 0;">[${l.date}] ${l.user}: ${l.action}</div>`;
            });
        }

        // EXPOSE TO WINDOW FOR INLINE ONCLICK (COMPATIBILITY)
        window.deleteKey = id => openModal("Delete", id, () => remove(ref(db, `keys/${id}`)));
        window.resetHwid = id => { update(ref(db, `keys/${id}`), { hwid: "" }); alert("Reset!"); };
        window.deleteReseller = u => openModal("Remove", u, () => remove(ref(db, `resellers/${u}`)));
        window.editReseller = async (u) => {
            const snap = await get(ref(db, `resellers/${u}`));
            document.getElementById('res-name').value = u;
            document.getElementById('res-pass').value = snap.val().password;
            document.getElementById('res-creds').value = snap.val().credits;
        };

        function navigate(id, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
        }

        function openModal(title, msg, action) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-msg').innerText = msg;
            document.getElementById('modal-global').style.display = 'flex';
            currentModalAction = action;
        }

        function closeModal() { document.getElementById('modal-global').style.display = 'none'; }
        function toggleDrawer() { document.getElementById('drawer-logs').classList.toggle('open'); }
        function confirmLogout() { openModal("Sair", "Deseja sair?", () => location.reload()); }
    </script>
</body>
</html>
